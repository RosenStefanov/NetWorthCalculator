# Detekt configuration for NetWorthCalculator
# Uses default rules as base (buildUponDefaultConfig = true in build.gradle.kts).
# Only overrides that differ from defaults are listed here.

complexity:
  LongMethod:
    threshold: 30
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreAnnotated:
      - "Composable"
  ComplexMethod:
    threshold: 15
  TooManyFunctions:
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInInterfaces: 10
    thresholdInObjects: 10
    thresholdInEnums: 10
  CyclomaticComplexMethod:
    threshold: 15
  NestedBlockDepth:
    threshold: 5

coroutines:
  GlobalCoroutineUsage:
    active: true

naming:
  FunctionNaming:
    ignoreAnnotated:
      - "Composable"
  TopLevelPropertyNaming:
    constantPattern: "[A-Z][A-Za-z0-9]*"

style:
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
  MagicNumber:
    active: false
  ForbiddenComment:
    active: false
  ReturnCount:
    max: 3
  WildcardImport:
    active: false
  UnusedPrivateMember:
    allowedNames: "(_|ignored|expected|serialVersionUID)"

formatting:
  active: false

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true

exceptions:
  TooGenericExceptionCaught:
    exceptionNames:
      - "ArrayIndexOutOfBoundsException"
      - "Error"
      - "Exception"
      - "IllegalMonitorStateException"
      - "IndexOutOfBoundsException"
      - "NullPointerException"
      - "RuntimeException"
      - "Throwable"
  SwallowedException:
    active: true
  TooGenericExceptionThrown:
    active: true
