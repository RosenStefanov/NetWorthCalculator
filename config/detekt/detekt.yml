# Detekt configuration for NetWorthCalculator
# Uses default rules as base (buildUponDefaultConfig = true in build.gradle.kts).
# Only overrides that differ from defaults are listed here.

complexity:
  LongMethod:
    threshold: 30
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreAnnotated:
      - "Composable"
  ComplexMethod:
    threshold: 15
  TooManyFunctions:
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInInterfaces: 10
    thresholdInObjects: 10
    thresholdInEnums: 10
  CyclomaticComplexMethod:
    threshold: 15
  NestedBlockDepth:
    threshold: 5

coroutines:
  GlobalCoroutineUsage:
    active: true

naming:
  FunctionNaming:
    ignoreAnnotated:
      - "Composable"
  TopLevelPropertyNaming:
    constantPattern: "[A-Z][A-Za-z0-9]*"

style:
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
  MagicNumber:
    # Disabled: Compose modifier/layout code uses literal dp/sp values heavily;
    # extracting every dimension into a named const produces more noise than value.
    active: false
  ForbiddenComment:
    # Disabled: TODO/FIXME comments are an intentional progress-tracking tool during
    # staged development. Will revisit in Stage 11 (release prep).
    active: false
  ReturnCount:
    max: 3
  WildcardImport:
    # Disabled: ktlint already enforces no-wildcard-imports; having both rules report
    # the same issue produces duplicate CI annotations.
    active: false
  UnusedPrivateMember:
    allowedNames: "(_|ignored|expected|serialVersionUID)"

formatting:
  # Disabled: ktlint is the single authority for formatting rules. Running both
  # detekt's formatting ruleset and ktlint produces conflicting fix suggestions
  # and duplicate CI annotations for the same issue.
  active: false

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true

exceptions:
  TooGenericExceptionCaught:
    exceptionNames:
      - "ArrayIndexOutOfBoundsException"
      - "Error"
      - "Exception"
      - "IllegalMonitorStateException"
      - "IndexOutOfBoundsException"
      - "NullPointerException"
      - "RuntimeException"
      - "Throwable"
  SwallowedException:
    active: true
  TooGenericExceptionThrown:
    active: true
